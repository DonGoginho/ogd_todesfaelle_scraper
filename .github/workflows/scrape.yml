name: Todesfälle scrapen

on:
  schedule:
    # Am 8. jedes Monats um 08:00 UTC (die Daten werden meist in der ersten Woche publiziert)
    - cron: "0 8 8 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scrape.py

      - name: Commit und Push falls neue Daten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Todesfälle $(date +%Y-%m-%d)"
          git push

      - name: Upload file to CKAN
        env:
          CKAN_BASE_URL: ${{ secrets.CKAN_BASE_URL }}
          CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}
          SSL_VERIFY: ${{ secrets.SSL_VERIFY }}
        run: |
          python upload_resource_to_ckan.py -f data/todesfaelle_stadt_zuerich.csv -d prd_bva_todesfaelle_publiziert

      - name: Update CKAN metadata
        env:
          CKAN_BASE_URL: ${{ secrets.CKAN_BASE_URL }}
          CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}
          SSL_VERIFY: ${{ secrets.SSL_VERIFY }}
        run: |
          python update_metadata.py -d prd_bva_todesfaelle_publiziert
