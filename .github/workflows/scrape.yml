name: Todesfälle scrapen

on:
  schedule:
    # Am 8. jedes Monats um 08:00 UTC (die Daten werden meist in der ersten Woche publiziert)
    - cron: "0 8 8 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scrape.py

      - name: Commit und Push falls neue Daten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Todesfälle $(date +%Y-%m-%d)"
          git push
